<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">


  <!-- =====================================================
       PAGE / BROWSER TAB TITLE

       CHANGE THIS if you want to rename the viewer.

       This does NOT change the GitHub repository name.
       ===================================================== -->

  <title>Lough Ree 330 – 360° Heritage Survey</title>


  <!-- =====================================================
       PHOTO SPHERE VIEWER CSS

       DO NOT normally change this.
       ===================================================== -->

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css">


  <!-- =====================================================
       VIEWER SIZE

       CHANGE THIS if you want to alter the size
       of the 360° viewer.

       100vh = full height of the browser window.
       ===================================================== -->

  <style>

    html, body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

    }


    #viewer {

      width: 100%;

      /* CHANGE VIEWER HEIGHT HERE IF REQUIRED */

      height: 100vh;

    }

  </style>

</head>


<body>


<!-- =====================================================
     PHOTO SPHERE VIEWER CONTAINER

     DO NOT change this unless you also change the
     JavaScript below.
     ===================================================== -->

<div id="viewer"></div>



<!-- =====================================================
     PHOTO SPHERE VIEWER LIBRARIES

     DO NOT normally change these.

     These load Three.js and Photo Sphere Viewer.
     ===================================================== -->

<script type="importmap">

{
  "imports": {

    "three":
      "https://cdn.jsdelivr.net/npm/three/build/three.module.js",

    "@photo-sphere-viewer/core":
      "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js"

  }
}

</script>



<script type="module">


/* ========================================================
   LOAD PHOTO SPHERE VIEWER

   DO NOT normally change this.
   ======================================================== */

import { Viewer } from '@photo-sphere-viewer/core';



/* ========================================================
   GET SITE NAME FROM THE URL

   DO NOT normally change this.

   Example:

   viewer.html?site=LF021-048006

   The code extracts:

   LF021-048006
   ======================================================== */

const urlParams = new URLSearchParams(window.location.search);

const site = urlParams.get('site');



/* ========================================================
   CHECK THAT A SITE NAME WAS PROVIDED
   ======================================================== */

if (!site) {

  document.body.innerHTML = `

    <div style="
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    ">

      <h2>Lough Ree 330 – 360° Viewer</h2>

      <p>
        No site was specified.
      </p>

      <p>
        Please provide a site reference in the URL.
      </p>

    </div>

  `;

  throw new Error('No site specified');

}



/* ========================================================
   CREATE THE IMAGE PATH

   ========================================================

   THIS IS THE IMPORTANT PART.

   The code automatically takes the site reference
   from the URL and adds:

       images/
       .jpg

   For example:

       LF021-048006

   becomes:

       images/LF021-048006.jpg

   Therefore you do NOT need to add every image
   manually to this script.

   ======================================================== */

const imagePath = 'images/' + site + '.jpg';



/* ========================================================
   CREATE THE 360° VIEWER

   DO NOT normally change this section.
   ======================================================== */

const viewer = new Viewer({

  container: document.querySelector('#viewer'),

  panorama: imagePath

});


</script>


</body>

</html>
